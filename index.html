<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albumy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Albumy</h1>
      <nav aria-label="Main navigation">
        <a class="nav-link" href="index.html" aria-current="page">Albums</a>
        <a class="nav-link" href="about.html">About</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Settings</h2>
        <form id="settings-form" class="settings-form">
          <label for="photos-path">Photos path</label>
          <input id="photos-path" name="photos-path" type="text" value="/photos" aria-describedby="settings-help" />
          <p id="settings-help" class="muted">Use same-origin paths like <strong>/photos</strong> or <strong>./photos</strong>.</p>
          <button type="submit">Save & Reload</button>
        </form>
        <div id="settings-status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="album-controls-heading">
        <h2 id="album-controls-heading">Albums</h2>
        <form id="album-create-form" class="album-form">
          <label for="album-title">Album title</label>
          <input id="album-title" name="album-title" maxlength="80" required />

          <label for="album-date">Album date</label>
          <input id="album-date" name="album-date" type="date" required />

          <button type="submit">Create album</button>
        </form>
        <p class="muted">Drag and drop to reorder. Keyboard users can use move controls.</p>
      </section>

      <section class="panel panel-wide" aria-labelledby="groups-heading">
        <h2 id="groups-heading">Date groups</h2>
        <div id="groups-status" class="status"></div>
        <div id="album-groups" class="groups" aria-live="polite"></div>
      </section>

      <section class="panel panel-wide" aria-labelledby="album-detail-heading">
        <h2 id="album-detail-heading">Album preview</h2>
        <div id="album-detail" class="album-detail"></div>
      </section>
    </main>

    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
